
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>Sign in | AetherCode</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card">
      <a class="brand" href="index.html">AETHER<span>CODE</span><small>DIGITAL SOLUTIONS</small></a>
      <div class="panel">
        <span class="eyebrow">CLIENT WORKSPACE</span>
        <h1 id="authTitle">Welcome back.</h1>
        <p id="authDescription">Sign in to manage your digital projects.</p>

        <form id="authForm" class="stack">
          <div class="field" id="nameField" hidden>
            <label for="displayName">Full name</label>
            <input id="displayName" autocomplete="name" maxlength="100">
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" type="email" autocomplete="email" required maxlength="254">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" minlength="8" required>
          </div>
          <button class="button w-full" id="authSubmit" type="submit">Sign in</button>
        </form>

        <button class="button button-ghost w-full" id="googleButton" type="button" style="margin-top:12px">Continue with Google</button>
        <div class="divider">OR</div>
        <p id="modeSwitch">New here? <a class="inline-link" href="#" id="toggleMode">Create account</a></p>
        <button class="inline-link" id="forgotPassword" type="button" style="background:none;border:0;padding:0">Forgot password?</button>
        <div id="authNotice" class="notice" role="status" style="margin-top:18px" hidden></div>
        <p class="small-text" style="margin-top:20px">Owner privileges are assigned separately and cannot be selected during signup.</p>
      </div>
    </section>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
